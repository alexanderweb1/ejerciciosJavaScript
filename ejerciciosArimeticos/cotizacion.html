<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cotizacion</title>
	<link rel="stylesheet" type="text/css" href="css/estilos.css">
</head>

<body>
	<div class="contenedor">
		<form method="post" class="formulario" id="formulario">
			<fieldset>
				<legend>Cotizacion Euro-Dolar</legend>
				<div class="campos">
					<label for="euros">Cantidad en Euros</label>
					<input type="number" step="any" id="euros" name="euros">
				</div>

				<div class="campos">
					<label for="dolares">Cantidad en Dolares</label>
					<input type="number" step="any" id="dolares" name="dolares">
				</div>

				<button type="submit" class="btn_calcular">Calcular</button>

				<div class="resultado-div">
					<p>El resultado es: <span id="textoResultado"></span></p>
				</div>
			</fieldset>
		</form>
	</div>
	<script src="js/cotizacion.js"></script>
</body>

</html>
